name: Aktualizace dat

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace knihoven
        run: pip install requests beautifulsoup4

      - name: Stažení tabulky
        run: python scripts/tabulka.py

      # Když spadne jeden skript, druhý se stejně uloží.
      - name: Stažení statistik hráčů
        if: always()
        run: python scripts/hraci.py

      - name: Uložení změn
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet tabulka.json hraci.json; then
            echo "Data se nezměnila, není co ukládat."
          else
            git add tabulka.json hraci.json
            git commit -m "Aktualizace tabulky a statistik"
            git push
          fi
